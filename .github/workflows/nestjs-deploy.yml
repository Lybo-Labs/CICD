# ──────────────────────────────────────────────────────────────────────────────
# Reusable workflow: NestJS Backend Deploy (Docker Compose)
# ──────────────────────────────────────────────────────────────────────────────
# Lives in: Lybo-Labs/cicd/.github/workflows/nestjs-deploy.yml
#
# Strategy: Trunk-Based Development
#   - PR to main → test + build validation (via nestjs-ci.yml)
#   - Manual dispatch → deploy to development / staging / production
#   - Production requires a tag (validated by caller)
#
# Deploys using Docker Compose on a self-hosted runner (lybo-onpremise).
# The app is then exposed via Nginx Proxy Manager.
#
# Backups: right before every migration, the `db` service is dumped
# (pg_dump | gzip) to <deploy-dir>/backups/ on the same host. This is a
# local-only stopgap — it protects against a bad migration, but NOT against
# loss of the host/disk itself. Shipping these dumps to offsite storage
# (S3/R2/B2) is a follow-up, not yet wired here.
#
# Migrations run as an explicit, logged step (`prisma migrate deploy`)
# between the backup and bringing the app up — not silently inside the
# container's CMD — so a bad migration shows up in the deploy log right
# next to the backup that was taken for it, instead of being buried in
# container boot output.
#
# Caller repos invoke it with:
#   uses: Lybo-Labs/cicd/.github/workflows/nestjs-deploy.yml@main
#
# Secrets beyond POSTGRES_PASSWORD (e.g. an SMTP password): the caller job
# adds `secrets: inherit` and lists the secret's name in
# `runtime-secret-vars` (same shape as `runtime-env-vars`, but sourced from
# the caller's `secrets` context instead of `vars`) — no per-secret input
# needs to be added here for that to work; `secrets: inherit` is what makes
# the caller's full secrets context (repo + the target Environment's own
# secrets) visible to this workflow, keyed by name, without ever printing a
# value into workflow logs. POSTGRES_PASSWORD stays its own explicit,
# required input — it's used by every caller today, so it's worth keeping
# self-documenting rather than folding it into the generic list.
# ──────────────────────────────────────────────────────────────────────────────

name: NestJS Deploy

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Application name (used for container and project naming)'
        required: true
        type: string
      port:
        description: 'Host port to expose the backend on'
        required: false
        type: string
        default: '3000'
      environment:
        description: 'GitHub Environment (production | staging | development)'
        required: true
        type: string
      deploy-dir:
        description: 'Absolute path on the server where the app is deployed'
        required: true
        type: string
      runtime-env-vars:
        description: 'Newline-separated GitHub vars to append to .env'
        required: false
        type: string
        default: ''
      runtime-secret-vars:
        description: >-
          Newline-separated GitHub secret names to append to .env. Values
          come from the caller's secrets context — the caller must invoke
          this workflow with `secrets: inherit` for these to resolve to
          anything but an empty string.
        required: false
        type: string
        default: ''
      backup-retention:
        description: 'Number of local backups to keep per app+environment'
        required: false
        type: string
        default: '14'
    secrets:
      POSTGRES_PASSWORD:
        description: 'PostgreSQL password'
        required: true

jobs:
  deploy:
    runs-on: self-hosted
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p ${{ inputs.deploy-dir }}
          mkdir -p ${{ inputs.deploy-dir }}/backups

      - name: Sync project files
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'postgres-data' \
            --exclude 'backups' \
            --exclude '.env' \
            ./ ${{ inputs.deploy-dir }}/

      - name: Write .env file
        shell: bash
        env:
          GITHUB_VARS_JSON: ${{ toJson(vars) }}
          RUNTIME_ENV_VARS: ${{ inputs.runtime-env-vars }}
          RUNTIME_SECRET_VARS: ${{ inputs.runtime-secret-vars }}
        run: |
          # URL-encode the password for safe use in DATABASE_URL
          ENCODED_PASS=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ secrets.POSTGRES_PASSWORD }}', safe=''))")

          cat > ${{ inputs.deploy-dir }}/.env << EOF
          APP_ENV=${{ inputs.environment }}
          BACKEND_PORT=${{ inputs.port }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_PORT=${{ vars.POSTGRES_PORT }}
          ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
          DATABASE_URL=postgresql://${{ vars.POSTGRES_USER }}:${ENCODED_PASS}@db:5432/${{ vars.POSTGRES_DB }}?schema=public
          EOF
          python3 << 'PY' >> ${{ inputs.deploy-dir }}/.env
          import json
          import os

          github_vars = json.loads(os.environ['GITHUB_VARS_JSON'])
          runtime_env_vars = os.environ.get('RUNTIME_ENV_VARS', '').splitlines()

          for name in runtime_env_vars:
              name = name.strip()
              if not name or name.startswith('#'):
                  continue
              print(f'{name}={github_vars.get(name, "")}')
          PY
          sed -i 's/^[[:space:]]*//' ${{ inputs.deploy-dir }}/.env

      - name: Stop existing containers
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} down --remove-orphans || true

      - name: Start database
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} up -d db

      - name: Wait for database to be healthy
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          echo "Waiting for db to be healthy..."
          timeout 60 bash -c '
            until docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} exec -T db \
              pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; do
              sleep 2
            done
          '
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}

      - name: Backup database before migrating
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          PREFIX="${{ inputs.app-name }}-${{ inputs.environment }}"
          FILE="backups/${PREFIX}-${STAMP}.sql.gz"

          docker compose -p "$PREFIX" exec -T db \
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$FILE"
          echo "✅ Backup written to $FILE ($(du -h "$FILE" | cut -f1))"

          # Local-only retention: keep the last N dumps for this app+environment.
          # Not a substitute for offsite storage — just keeps the host disk bounded.
          ls -1t "backups/${PREFIX}"-*.sql.gz 2>/dev/null \
            | tail -n +$(( ${{ inputs.backup-retention }} + 1 )) \
            | xargs -r rm -v --
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}

      - name: Build backend image
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} build backend

      - name: Run database migrations
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} run --rm backend \
            npx prisma migrate deploy

      - name: Deploy containers
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} up -d

      - name: Wait for healthy containers
        working-directory: ${{ inputs.deploy-dir }}
        run: |
          echo "Waiting for containers to be healthy..."
          timeout 60 bash -c '
            until docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} ps --format json | \
              grep -q "running"; do
              sleep 2
            done
          '

      - name: Health check
        run: |
          echo "Waiting for app to respond on port ${{ inputs.port }}..."
          timeout 90 bash -c '
            until curl -sf http://localhost:${{ inputs.port }}/ > /dev/null 2>&1; do
              sleep 3
            done
          ' || (docker compose -p ${{ inputs.app-name }}-${{ inputs.environment }} logs --tail=50 && exit 1)
          echo "✅ App is healthy"

      - name: Cleanup old images
        run: |
          docker image prune -f
